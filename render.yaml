# Render blueprint - free tier, no credit card needed.
# Deploy straight from this repo: Render reads this file automatically.
services:
  - type: web
    name: qeep-revival
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Free instances have an ephemeral disk, so the file-backed save is lost
    # when the service restarts. To keep profiles/coins forever, add a Postgres
    # database and set DATABASE_URL - the server switches storage automatically.
    #
    # envVars:
    #   - key: DATABASE_URL
    #     fromDatabase:
    #       name: qeep-db
    #       property: connectionString
    #
    # databases:
    #   - name: qeep-db
    #     plan: free
